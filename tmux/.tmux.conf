# ─────────────────────────────
# Basic usability
# ─────────────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ─────────────────────────────
# Change prefix: Ctrl+b → Ctrl+Space
# ─────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─────────────────────────────
# Vim-style pane navigation
# ─────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + vim keys
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ─────────────────────────────
# Cleaner status bar behavior
# ─────────────────────────────

# Enable true color
set -g default-terminal "tmux-256color"
#set -ga terminal-overrides ",*:Tc"
set -g allow-passthrough on
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# Status bar
set -g status on
set -g status-interval 1
set -g status-justify centre
set -g status-position top

# Tokyo Night colors
set -g status-style "bg=#24283d fg=#a9b1d6"

# Left side (session name)
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default]"

# Window tabs
set -g window-status-format " #[fg=#a9b1d6]#I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W "

# Right side (date/time)
set -g status-right "#[fg=#1a1b26,bg=#7aa2f7,bold] %Y-%m-%d "

# Pane border
set -g pane-border-style fg=#3b4261
set -g pane-active-border-style fg=#7aa2f7

# Set new panes to open in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ─────────────────────────────
# Tmux Plugins
# ─────────────────────────────
# To make plugins work first it is needed to install tpm
# After defining the plugins config, source the .tmux.conf file
# and activate the plugins with Prefix+I
set -g @plugin 'tmux-plugins/tpm'

# Sessions plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable automatic restore on reboot
set -g @continuum-restore 'on'

# Enable saving vim sessions
set -g @ressurect-strategy-vim 'session'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
